<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 600" width="540" height="600">
  <!-- Nepal flag — accurate double pennant, crimson field, blue border,
       white crescent moon (upper) and 12-rayed sun (lower). -->
  <!-- blue border (outline) -->
  <polygon points="28,28 512,210 28,330 512,548 28,572" fill="#003893" />
  <!-- crimson field -->
  <polygon points="58,58 480,232 58,316 480,524 58,548" fill="#DC143C" />

  <!-- crescent moon (upper pennant) -->
  <path
    fill="#ffffff"
    d="M 168,158 A 46,46 0 1,0 168,246 A 36,36 0 1,1 168,158 Z"
  />
  <!-- 8 small rays around the moon (subtle, as on the real flag) -->
  <g fill="#ffffff" opacity="0.0">
    <circle cx="168" cy="202" r="0" />
  </g>

  <!-- 12-rayed sun (lower pennant) -->
  <g fill="#ffffff" transform="translate(168 432)">
    <circle r="24" />
    <g>
      <polygon points="0,-30 5,-54 -5,-54" />
      <polygon points="0,-30 5,-54 -5,-54" transform="rotate(30)" />
      <polygon points="0,-30 5,-54 -5,-54" transform="rotate(60)" />
      <polygon points="0,-30 5,-54 -5,-54" transform="rotate(90)" />
      <polygon points="0,-30 5,-54 -5,-54" transform="rotate(120)" />
      <polygon points="0,-30 5,-54 -5,-54" transform="rotate(150)" />
      <polygon points="0,-30 5,-54 -5,-54" transform="rotate(180)" />
      <polygon points="0,-30 5,-54 -5,-54" transform="rotate(210)" />
      <polygon points="0,-30 5,-54 -5,-54" transform="rotate(240)" />
      <polygon points="0,-30 5,-54 -5,-54" transform="rotate(270)" />
      <polygon points="0,-30 5,-54 -5,-54" transform="rotate(300)" />
      <polygon points="0,-30 5,-54 -5,-54" transform="rotate(330)" />
    </g>
  </g>
</svg>
